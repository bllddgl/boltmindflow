name: mindflow
description: "MindFlow — read faster, understand more, remember longer."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Backend (Supabase — database, auth, storage)
  supabase_flutter: ^2.5.0

  # File picking & sharing
  file_picker: ^8.0.0+1

  # Document parsing (Phase 1)
  epubx: ^4.0.0
  archive: ^3.5.1
  pdf: ^3.10.8
  pdf_text: ^0.5.0

  # Utilities
  uuid: ^4.4.0
  collection: ^1.18.0
  intl: ^0.19.0
  path_provider: ^2.1.3

  # Responsive
  responsive_builder: ^0.7.0

  # UI
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - lib/l10n/
